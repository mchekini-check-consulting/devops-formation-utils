# ArgoCD Helm values - HA setup with Azure AD SSO
# Chart: argo/argo-cd from https://argoproj.github.io/argo-helm

# ── HA: 3 replicas for core components ──
controller:
  replicas: 3

repoServer:
  replicas: 3

server:
  replicas: 3

  # Service type LoadBalancer (no Ingress) - provisions an AWS ELB
  service:
    type: LoadBalancer

  # ArgoCD serves HTTPS with self-signed cert
  extraArgs: []

# ── SSO: none for now, admin/initial-admin-secret only ──
# Ré-ajouter un bloc `configs.cm.oidc.config` + `configs.rbac` ici quand
# le SSO (AWS IAM Identity Center ou autre) sera décidé.
configs:
  cm:
    url: ""  # Set to LoadBalancer external IP/DNS after deployment

  params:
    server.insecure: false

# ── Désactiver les composants inutilisés ──
dex:
  enabled: false

notifications:
  enabled: false